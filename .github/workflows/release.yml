name: Auto Release

on:
  push:
    branches:
      - main

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.repository == 'Gitlawb/openclaude' }}
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-pr-resolve:
    name: Resolve Release Please PR
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      found: ${{ steps.release-pr.outputs.found }}
      number: ${{ steps.release-pr.outputs.number }}
      branch: ${{ steps.release-pr.outputs.branch }}
      head_sha: ${{ steps.release-pr.outputs.head_sha }}
    steps:
      # A rerun after a failed sync has no `pr` output because Release Please
      # does not update an unchanged pending PR. Recover that PR explicitly;
      # this job owns its draft/ready state while synchronization is pending.
      - name: Resolve Release Please PR for web synchronization
        id: release-pr
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_PR_JSON: ${{ needs.release-please.outputs.pr }}
          RELEASE_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          release_pr="$RELEASE_PR_JSON"
          if [ -z "$release_pr" ] || [ "$release_pr" = "null" ]; then
            candidates="$(gh pr list --state open --base "$RELEASE_BASE_BRANCH" --label 'autorelease: pending' --limit 2 --json number)"
            candidate_count="$(jq length <<<"$candidates")"
            if [ "$candidate_count" -eq 0 ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$candidate_count" -ne 1 ]; then
              echo "expected exactly one pending Release Please PR for $RELEASE_BASE_BRANCH, found $candidate_count" >&2
              exit 1
            fi

            release_pr="$(jq -c '.[0]' <<<"$candidates")"
          fi

          number="$(jq -r '.number // empty' <<<"$release_pr")"
          if [ -z "$number" ]; then
            echo "release PR JSON is missing its number" >&2
            exit 1
          fi

          release_pr="$(gh pr view "$number" --json number,state,author,baseRefName,headRefName,headRefOid,headRepositoryOwner,isCrossRepository)"
          state="$(jq -r .state <<<"$release_pr")"
          author="$(jq -r .author.login <<<"$release_pr")"
          base="$(jq -r .baseRefName <<<"$release_pr")"
          branch="$(jq -r .headRefName <<<"$release_pr")"
          head_sha="$(jq -r .headRefOid <<<"$release_pr")"
          head_owner="$(jq -r .headRepositoryOwner.login <<<"$release_pr")"
          cross_repo="$(jq -r .isCrossRepository <<<"$release_pr")"
          expected_prefix="release-please--branches--${RELEASE_BASE_BRANCH}--components--"

          if [ "$state" != "OPEN" ] \
            || { [ "$author" != "app/github-actions" ] && [ "$author" != "github-actions[bot]" ]; } \
            || [ "$base" != "$RELEASE_BASE_BRANCH" ] \
            || [[ "$branch" != "$expected_prefix"* ]] \
            || [ -z "$head_sha" ] \
            || [ "$head_owner" != "$RELEASE_REPO_OWNER" ] \
            || [ "$cross_repo" != "false" ]; then
            echo "pending PR #$number does not match the expected same-repository Release Please identity" >&2
            jq . <<<"$release_pr" >&2
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Keep the release PR as a draft until web synchronization passes
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          if [ "$(gh pr view "$RELEASE_PR_NUMBER" --json isDraft --jq .isDraft)" = "false" ]; then
            gh pr ready "$RELEASE_PR_NUMBER" --undo
          fi

  release-pr-validate:
    name: Validate Release Please PR
    needs: release-pr-resolve
    if: ${{ needs.release-pr-resolve.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tree_sha: ${{ steps.validated-tree.outputs.sha }}
    steps:
      # Release Please's PR contains the generated changelog and manifest.
      # Synchronize the standalone web version there, before that PR merges.
      - name: Check out Release Please PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-pr-resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release PR merge base
        id: sync-base
        env:
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
        run: |
          base_sha="$(git merge-base "origin/$RELEASE_BASE_BRANCH" HEAD)"
          if [ -z "$base_sha" ]; then
            echo "could not resolve the release PR merge base" >&2
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Verify the Release Please change contract
        env:
          RELEASE_BASE_REF: ${{ steps.sync-base.outputs.sha }}
        run: |
          unexpected=false
          while IFS= read -r path; do
            case "$path" in
              .release-please-manifest.json|CHANGELOG.md|package.json|web/src/data/releases.ts) ;;
              *)
                echo "unexpected file in Release Please PR: $path" >&2
                unexpected=true
                ;;
            esac
          done < <(git diff --name-only "$RELEASE_BASE_REF"...HEAD)
          if [ "$unexpected" = "true" ]; then
            exit 1
          fi

          for path in .release-please-manifest.json CHANGELOG.md package.json web/src/data/releases.ts; do
            entry="$(git ls-tree HEAD -- "$path")"
            if [[ "$entry" != "100644 blob "* ]]; then
              echo "Release Please file must remain a regular non-executable blob: $path" >&2
              exit 1
            fi
          done

          if ! diff -u \
            <(git show "${RELEASE_BASE_REF}:package.json" | jq -S 'del(.version)') \
            <(jq -S 'del(.version)' package.json); then
            echo "Release Please PR changes package.json fields other than version" >&2
            exit 1
          fi

          if ! diff -u \
            <(git show "${RELEASE_BASE_REF}:.release-please-manifest.json" | jq -S 'del(.["."])') \
            <(jq -S 'del(.["."])' .release-please-manifest.json); then
            echo "Release Please PR changes manifest fields other than the root version" >&2
            exit 1
          fi

          package_version="$(jq -r .version package.json)"
          manifest_version="$(jq -r '.["."]' .release-please-manifest.json)"
          base_package_version="$(git show "${RELEASE_BASE_REF}:package.json" | jq -r .version)"
          base_manifest_version="$(git show "${RELEASE_BASE_REF}:.release-please-manifest.json" | jq -r '.["."]')"
          if [ "$package_version" != "$manifest_version" ] \
            || [ "$base_package_version" != "$base_manifest_version" ]; then
            echo "package and Release Please manifest versions do not match" >&2
            exit 1
          fi

          BASE_VERSION="$base_package_version" NEXT_VERSION="$package_version" node -e '
            const identifier = "(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
            const pattern = new RegExp(
              `^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)` +
              `(?:-(${identifier}(?:\\.${identifier})*))?` +
              `(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`,
            )
            const parse = value => {
              const match = value.match(pattern)
              if (!match) throw new Error(`invalid SemVer: ${value}`)
              return {
                core: [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])],
                prerelease: match[4]?.split(".") ?? null,
              }
            }
            const compare = (left, right) => {
              for (let index = 0; index < 3; index++) {
                if (left.core[index] !== right.core[index])
                  return left.core[index] < right.core[index] ? -1 : 1
              }
              if (left.prerelease === null || right.prerelease === null)
                return left.prerelease === right.prerelease ? 0 : left.prerelease === null ? 1 : -1
              const length = Math.max(left.prerelease.length, right.prerelease.length)
              for (let index = 0; index < length; index++) {
                const a = left.prerelease[index]
                const b = right.prerelease[index]
                if (a === undefined || b === undefined) return a === b ? 0 : a === undefined ? -1 : 1
                if (a === b) continue
                const aNumeric = /^\\d+$/.test(a)
                const bNumeric = /^\\d+$/.test(b)
                if (aNumeric && bNumeric) return BigInt(a) < BigInt(b) ? -1 : 1
                if (aNumeric !== bNumeric) return aNumeric ? -1 : 1
                return a < b ? -1 : 1
              }
              return 0
            }
            const base = parse(process.env.BASE_VERSION)
            const next = parse(process.env.NEXT_VERSION)
            if (compare(next, base) <= 0)
              throw new Error(`release version must advance: ${process.env.BASE_VERSION} -> ${process.env.NEXT_VERSION}`)
          '

          # The bot owns this file. Rebuild it from the trusted base so a
          # collaborator push cannot smuggle executable TypeScript into it.
          git show "${RELEASE_BASE_REF}:web/src/data/releases.ts" > web/src/data/releases.ts

      - name: Set up current Node.js for release PR validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.x"

      - name: Set up Bun for release PR sync
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Sync web release entry
        env:
          RELEASE_BASE_REF: ${{ steps.sync-base.outputs.sha }}
        run: |
          bun install --frozen-lockfile
          bun run sync:web-release -- --base-ref "$RELEASE_BASE_REF"
          bun install --cwd web --frozen-lockfile

      - name: Commit synced web release entry
        run: |
          if git diff --quiet -- web/src/data/releases.ts; then
            echo "releases.ts already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/releases.ts
          git commit -m "chore(web): sync releases.ts from release-please changelog"

      - name: Validate synchronized release PR on current Node.js
        env:
          RELEASE_BASE_REF: ${{ steps.sync-base.outputs.sha }}
        run: |
          bun test ./scripts/sync-web-release-entry.test.ts
          bun run check
          bun run typecheck
          bun run typecheck:type-tests
          node bin/openclaude --version
          NODE_DISABLE_COMPILE_CACHE=1 node bin/openclaude --version
          bun run test:provider
          bun run test:provider-recommendation
          bun run security:pr-scan -- --base "$RELEASE_BASE_REF" --head HEAD
          git diff --check "$RELEASE_BASE_REF"...HEAD

      - name: Set up minimum supported Node.js for release PR validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.0.0"

      - name: Validate synchronized release PR on the Node.js floor
        run: |
          bun run check
          node bin/openclaude --version
          NODE_DISABLE_COMPILE_CACHE=1 node bin/openclaude --version
          bun run test:provider
          bun run test:provider-recommendation
          bun run --cwd web typecheck
          bun run --cwd web build

      - name: Confirm release validation left the commit unchanged
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "release validation changed tracked files after the synchronization commit" >&2
            git status --short
            exit 1
          fi

      - name: Capture validated tree
        id: validated-tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Save validated web release data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web-sync-${{ needs.release-pr-resolve.outputs.number }}-${{ needs.release-pr-resolve.outputs.head_sha }}
          path: web/src/data/releases.ts
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  release-pr-finalize:
    name: Finalize Release Please PR
    needs: [release-pr-resolve, release-pr-validate]
    if: ${{ needs.release-pr-resolve.outputs.found == 'true' && needs.release-pr-validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out captured Release Please PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-pr-resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore validated web release data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-web-sync-${{ needs.release-pr-resolve.outputs.number }}-${{ needs.release-pr-resolve.outputs.head_sha }}
          path: web/src/data

      - name: Recreate the validated synchronized commit
        env:
          VALIDATED_TREE_SHA: ${{ needs.release-pr-validate.outputs.tree_sha }}
        run: |
          if ! git diff --quiet -- web/src/data/releases.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/data/releases.ts
            git commit -m "chore(web): sync releases.ts from release-please changelog"
          fi

          actual_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [ "$actual_tree_sha" != "$VALIDATED_TREE_SHA" ]; then
            echo "restored release data does not recreate the validated tree" >&2
            echo "expected $VALIDATED_TREE_SHA, got $actual_tree_sha" >&2
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "finalization left uncommitted tracked changes" >&2
            git status --short
            exit 1
          fi

      - name: Push synchronized web release entry
        id: push-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR_BRANCH: ${{ needs.release-pr-resolve.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ needs.release-pr-resolve.outputs.number }}
          RELEASE_PR_HEAD_SHA: ${{ needs.release-pr-resolve.outputs.head_sha }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          VALIDATED_TREE_SHA: ${{ needs.release-pr-validate.outputs.tree_sha }}
        run: |
          current="$(gh pr view "$RELEASE_PR_NUMBER" --json state,baseRefName,headRefName,headRefOid)"
          if [ "$(jq -r .state <<<"$current")" != "OPEN" ] \
            || [ "$(jq -r .baseRefName <<<"$current")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$current")" != "$RELEASE_PR_BRANCH" ]; then
            echo "release PR changed or closed during validation" >&2
            jq . <<<"$current" >&2
            exit 1
          fi

          current_sha="$(jq -r .headRefOid <<<"$current")"
          if [ "$current_sha" = "$RELEASE_PR_HEAD_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/${RELEASE_PR_BRANCH}:${RELEASE_PR_HEAD_SHA}" \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${RELEASE_PR_BRANCH}"
            validated_head_sha="$(git rev-parse HEAD)"
          else
            # A failed-job rerun may start after the prior attempt pushed but
            # failed during readiness. Accept only the exact validated tree.
            git fetch --no-tags origin "$current_sha"
            current_tree_sha="$(git rev-parse "${current_sha}^{tree}")"
            if [ "$current_tree_sha" != "$VALIDATED_TREE_SHA" ]; then
              echo "release PR head changed to an unvalidated tree" >&2
              jq . <<<"$current" >&2
              exit 1
            fi
            validated_head_sha="$current_sha"
          fi

          echo "head_sha=$validated_head_sha" >> "$GITHUB_OUTPUT"

      - name: Mark synchronized release PR ready for review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ needs.release-pr-resolve.outputs.number }}
          RELEASE_PR_BRANCH: ${{ needs.release-pr-resolve.outputs.branch }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          VALIDATED_HEAD_SHA: ${{ steps.push-state.outputs.head_sha }}
        run: |
          current="$(gh pr view "$RELEASE_PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid)"

          if [ "$(jq -r .state <<<"$current")" != "OPEN" ] \
            || [ "$(jq -r .baseRefName <<<"$current")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$current")" != "$RELEASE_PR_BRANCH" ] \
            || [ "$(jq -r .headRefOid <<<"$current")" != "$VALIDATED_HEAD_SHA" ]; then
            echo "release PR no longer points at the validated commit" >&2
            jq . <<<"$current" >&2
            if [ "$(jq -r .state <<<"$current")" = "OPEN" ] && [ "$(jq -r .isDraft <<<"$current")" = "false" ]; then
              gh pr ready "$RELEASE_PR_NUMBER" --undo || true
            fi
            exit 1
          fi

          if [ "$(jq -r .isDraft <<<"$current")" = "true" ]; then
            gh pr ready "$RELEASE_PR_NUMBER"
          fi

          final="$(gh pr view "$RELEASE_PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid)"
          if [ "$(jq -r .state <<<"$final")" != "OPEN" ] \
            || [ "$(jq -r .isDraft <<<"$final")" != "false" ] \
            || [ "$(jq -r .baseRefName <<<"$final")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$final")" != "$RELEASE_PR_BRANCH" ] \
            || [ "$(jq -r .headRefOid <<<"$final")" != "$VALIDATED_HEAD_SHA" ]; then
            echo "release PR changed while it was being marked ready" >&2
            jq . <<<"$final" >&2
            if [ "$(jq -r .state <<<"$final")" = "OPEN" ] && [ "$(jq -r .isDraft <<<"$final")" = "false" ]; then
              gh pr ready "$RELEASE_PR_NUMBER" --undo || true
            fi
            exit 1
          fi

  # Zero-warning install gate: pack the release tag and install it globally in
  # a sandbox (cold + upgrade scenarios) on the supported Node floor (22 →
  # npm 10) and current (24 → npm 11), whose warning output differs. Publish
  # is blocked unless the real `npm install -g` experience is clean.
  install-verify:
    name: Verify clean npm install (Node ${{ matrix.node-version }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify zero-warning global install
        run: bun run install:verify

  publish-npm:
    name: Publish to npm
    needs: [release-please, install-verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run unit tests
        run: bun test --feature=UNATTENDED_RETRY --max-concurrency=1

      - name: Smoke test
        run: bun run smoke

      # Final install-hygiene gate on the publishing machine itself (the
      # install-verify job covered Node 22/24 already); packs with
      # --ignore-scripts to reuse the dist/ built above. Supersedes the old
      # `npm pack --dry-run` (contents are asserted inside the verify).
      - name: Verify zero-warning global install
        run: bun run install:verify

      - name: Clear token auth for trusted publishing
        run: |
          unset NODE_AUTH_TOKEN
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Verify npm latest dist-tag
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "release-please did not provide an expected version" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            published_version="$(npm view @gitlawb/openclaude version 2>/dev/null || true)"
            latest_tag="$(npm view @gitlawb/openclaude dist-tags.latest 2>/dev/null || true)"
            latest_version="$(npm view @gitlawb/openclaude@latest version 2>/dev/null || true)"

            echo "Attempt ${attempt}: version=${published_version:-<empty>} latest=${latest_tag:-<empty>} @latest=${latest_version:-<empty>} expected=${EXPECTED_VERSION}"

            if [ "$published_version" = "$EXPECTED_VERSION" ] && \
               [ "$latest_tag" = "$EXPECTED_VERSION" ] && \
               [ "$latest_version" = "$EXPECTED_VERSION" ]; then
              echo "npm latest verified for @gitlawb/openclaude@${EXPECTED_VERSION}"
              exit 0
            fi

            sleep 10
          done

          echo "npm latest dist-tag did not resolve to ${EXPECTED_VERSION}" >&2
          echo "Observed package version: ${published_version:-<empty>}" >&2
          echo "Observed dist-tags.latest: ${latest_tag:-<empty>}" >&2
          echo "Observed @latest version: ${latest_version:-<empty>}" >&2
          exit 1

      - name: Release summary
        run: |
          {
            echo "## Released ${{ needs.release-please.outputs.tag_name }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@gitlawb/openclaude"
            echo "- GitHub: https://github.com/Gitlawb/openclaude/releases/tag/${{ needs.release-please.outputs.tag_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build & Push Docker Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      - name: Build and load locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: openclaude:smoke
          cache-from: type=gha

      - name: Smoke test
        run: docker run --rm openclaude:smoke --version

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
