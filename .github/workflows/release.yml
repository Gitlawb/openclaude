name: Auto Release

on:
  push:
    branches:
      - main

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.repository == 'Gitlawb/openclaude' }}
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create release commits/tags and push the synced releases.ts commit.
      pull-requests: write # Keep the bot release PR draft until sync lands, then mark ready.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Release Please's draft option applies only on PR creation. Draft any
      # existing pending bot PR before it updates the branch so an unvalidated
      # head is not left ready for merge.
      - name: Keep an existing Release Please PR draft before updating it
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          candidates="$(gh pr list --state open --base "$RELEASE_BASE_BRANCH" --label 'autorelease: pending' --limit 2 --json number)"
          candidate_count="$(jq length <<<"$candidates")"
          if [ "$candidate_count" -eq 0 ]; then
            exit 0
          fi
          if [ "$candidate_count" -ne 1 ]; then
            echo "expected at most one pending Release Please PR for $RELEASE_BASE_BRANCH, found $candidate_count" >&2
            exit 1
          fi

          number="$(jq -r '.[0].number' <<<"$candidates")"
          release_pr="$(gh pr view "$number" --json state,isDraft,author,baseRefName,headRefName,headRefOid,headRepositoryOwner,isCrossRepository)"
          expected_prefix="release-please--branches--${RELEASE_BASE_BRANCH}--components--"

          if [ "$(jq -r .state <<<"$release_pr")" != "OPEN" ] \
            || { [ "$(jq -r .author.login <<<"$release_pr")" != "app/github-actions" ] \
              && [ "$(jq -r .author.login <<<"$release_pr")" != "github-actions[bot]" ]; } \
            || [ "$(jq -r .baseRefName <<<"$release_pr")" != "$RELEASE_BASE_BRANCH" ] \
            || [[ "$(jq -r .headRefName <<<"$release_pr")" != "$expected_prefix"* ]] \
            || [ -z "$(jq -r .headRefOid <<<"$release_pr")" ] \
            || [ "$(jq -r .headRepositoryOwner.login <<<"$release_pr")" != "$RELEASE_REPO_OWNER" ] \
            || [ "$(jq -r .isCrossRepository <<<"$release_pr")" != "false" ]; then
            echo "pending PR #$number does not match the expected same-repository Release Please identity" >&2
            jq . <<<"$release_pr" >&2
            exit 1
          fi

          if [ "$(jq -r .isDraft <<<"$release_pr")" = "false" ]; then
            gh pr ready "$number" --undo
          fi

          if [ "$(gh pr view "$number" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "failed to keep pending Release Please PR #$number in draft state" >&2
            exit 1
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the pending bot PR (from the action output, or by label on
      # reruns where Release Please leaves an unchanged PR untouched). Keep it
      # draft, sync releases.ts from the trusted merge base, validate the sync
      # locally, push, then mark ready. Do not wait for ordinary PR checks:
      # GITHUB_TOKEN pushes do not start them.
      - name: Resolve pending Release Please PR
        id: release-pr
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
          RELEASE_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          release_pr="$RELEASE_PR_JSON"
          if [ -z "$release_pr" ] || [ "$release_pr" = "null" ]; then
            candidates="$(gh pr list --state open --base "$RELEASE_BASE_BRANCH" --label 'autorelease: pending' --limit 2 --json number)"
            candidate_count="$(jq length <<<"$candidates")"
            if [ "$candidate_count" -eq 0 ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$candidate_count" -ne 1 ]; then
              echo "expected exactly one pending Release Please PR for $RELEASE_BASE_BRANCH, found $candidate_count" >&2
              exit 1
            fi
            release_pr="$(jq -c '.[0]' <<<"$candidates")"
          fi

          number="$(jq -r '.number // empty' <<<"$release_pr")"
          if [ -z "$number" ]; then
            echo "release PR JSON is missing its number" >&2
            exit 1
          fi

          release_pr="$(gh pr view "$number" --json number,state,isDraft,author,baseRefName,headRefName,headRefOid,headRepositoryOwner,isCrossRepository)"
          state="$(jq -r .state <<<"$release_pr")"
          author="$(jq -r .author.login <<<"$release_pr")"
          base="$(jq -r .baseRefName <<<"$release_pr")"
          branch="$(jq -r .headRefName <<<"$release_pr")"
          head_sha="$(jq -r .headRefOid <<<"$release_pr")"
          head_owner="$(jq -r .headRepositoryOwner.login <<<"$release_pr")"
          cross_repo="$(jq -r .isCrossRepository <<<"$release_pr")"
          expected_prefix="release-please--branches--${RELEASE_BASE_BRANCH}--components--"

          if [ "$state" != "OPEN" ] \
            || { [ "$author" != "app/github-actions" ] && [ "$author" != "github-actions[bot]" ]; } \
            || [ "$base" != "$RELEASE_BASE_BRANCH" ] \
            || [[ "$branch" != "$expected_prefix"* ]] \
            || [ -z "$head_sha" ] \
            || [ "$head_owner" != "$RELEASE_REPO_OWNER" ] \
            || [ "$cross_repo" != "false" ]; then
            echo "pending PR #$number does not match the expected same-repository Release Please identity" >&2
            jq . <<<"$release_pr" >&2
            exit 1
          fi

          if [ "$(jq -r .isDraft <<<"$release_pr")" = "false" ]; then
            gh pr ready "$number" --undo
          fi
          if [ "$(gh pr view "$number" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "failed to keep pending Release Please PR #$number in draft state" >&2
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Release Please PR head
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release-pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun for release PR sync
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Sync and validate web release entry
        id: sync-web
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          base_sha="$(git merge-base "origin/$RELEASE_BASE_BRANCH" HEAD)"
          if [ -z "$base_sha" ]; then
            echo "could not resolve the release PR merge base" >&2
            exit 1
          fi

          # Rebuild from the trusted base so a collaborator push cannot smuggle
          # executable TypeScript through the bot-owned file.
          git show "${base_sha}:web/src/data/releases.ts" > web/src/data/releases.ts

          bun install --frozen-lockfile
          bun run sync:web-release -- --base-ref "$base_sha"
          bun test ./scripts/sync-web-release-entry.test.ts
          bun install --cwd web --frozen-lockfile
          bun run web:typecheck
          bun run web:build

          if ! git diff --quiet -- web/src/data/releases.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/data/releases.ts
            git commit -m "chore(web): sync releases.ts from release-please changelog"
          else
            echo "releases.ts already up to date"
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "sync validation left uncommitted tracked changes" >&2
            git status --short
            exit 1
          fi

      - name: Push synchronized web release entry
        id: push-sync
        if: ${{ steps.release-pr.outputs.found == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_HEAD_SHA: ${{ steps.release-pr.outputs.head_sha }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          current="$(gh pr view "$RELEASE_PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid)"
          if [ "$(jq -r .state <<<"$current")" != "OPEN" ] \
            || [ "$(jq -r .baseRefName <<<"$current")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$current")" != "$RELEASE_PR_BRANCH" ]; then
            echo "release PR changed or closed during sync" >&2
            jq . <<<"$current" >&2
            exit 1
          fi

          # Stay draft until the synced commit is on the remote head.
          if [ "$(jq -r .isDraft <<<"$current")" != "true" ]; then
            gh pr ready "$RELEASE_PR_NUMBER" --undo
            if [ "$(gh pr view "$RELEASE_PR_NUMBER" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "failed to keep release PR #$RELEASE_PR_NUMBER draft before push" >&2
              exit 1
            fi
          fi

          current_sha="$(jq -r .headRefOid <<<"$current")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" = "$RELEASE_PR_HEAD_SHA" ]; then
            auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
              git push \
              --force-with-lease="refs/heads/${RELEASE_PR_BRANCH}:${RELEASE_PR_HEAD_SHA}" \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${RELEASE_PR_BRANCH}"
          elif [ "$current_sha" = "$local_sha" ]; then
            # A rerun after a successful push can skip the lease push.
            echo "release PR already points at the synchronized commit"
          else
            echo "release PR head changed to an unvalidated commit" >&2
            jq . <<<"$current" >&2
            exit 1
          fi

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark synchronized release PR ready for review
        if: ${{ steps.release-pr.outputs.found == 'true' && steps.push-sync.outcome == 'success' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_BASE_BRANCH: ${{ github.ref_name }}
          VALIDATED_HEAD_SHA: ${{ steps.push-sync.outputs.head_sha }}
        run: |
          set -euo pipefail

          current="$(gh pr view "$RELEASE_PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid)"
          if [ "$(jq -r .state <<<"$current")" != "OPEN" ] \
            || [ "$(jq -r .baseRefName <<<"$current")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$current")" != "$RELEASE_PR_BRANCH" ] \
            || [ "$(jq -r .headRefOid <<<"$current")" != "$VALIDATED_HEAD_SHA" ]; then
            echo "release PR no longer points at the synchronized commit" >&2
            jq . <<<"$current" >&2
            if [ "$(jq -r .state <<<"$current")" = "OPEN" ] && [ "$(jq -r .isDraft <<<"$current")" = "false" ]; then
              gh pr ready "$RELEASE_PR_NUMBER" --undo
            fi
            exit 1
          fi

          if [ "$(jq -r .isDraft <<<"$current")" = "true" ]; then
            gh pr ready "$RELEASE_PR_NUMBER"
          fi

          final="$(gh pr view "$RELEASE_PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid)"
          if [ "$(jq -r .state <<<"$final")" != "OPEN" ] \
            || [ "$(jq -r .isDraft <<<"$final")" != "false" ] \
            || [ "$(jq -r .baseRefName <<<"$final")" != "$RELEASE_BASE_BRANCH" ] \
            || [ "$(jq -r .headRefName <<<"$final")" != "$RELEASE_PR_BRANCH" ] \
            || [ "$(jq -r .headRefOid <<<"$final")" != "$VALIDATED_HEAD_SHA" ]; then
            echo "release PR changed while it was being marked ready" >&2
            jq . <<<"$final" >&2
            if [ "$(jq -r .state <<<"$final")" = "OPEN" ] && [ "$(jq -r .isDraft <<<"$final")" = "false" ]; then
              gh pr ready "$RELEASE_PR_NUMBER" --undo
            fi
            exit 1
          fi

  # Zero-warning install gate: pack the release tag and install it globally in
  # a sandbox (cold + upgrade scenarios) on the supported Node floor (22 →
  # npm 10) and current (24 → npm 11), whose warning output differs. Publish
  # is blocked unless the real `npm install -g` experience is clean.
  install-verify:
    name: Verify clean npm install (Node ${{ matrix.node-version }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify zero-warning global install
        run: bun run install:verify

  publish-npm:
    name: Publish to npm
    needs: [release-please, install-verify]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run unit tests
        run: bun test --feature=UNATTENDED_RETRY --max-concurrency=1

      - name: Smoke test
        run: bun run smoke

      # Final install-hygiene gate on the publishing machine itself (the
      # install-verify job covered Node 22/24 already); packs with
      # --ignore-scripts to reuse the dist/ built above. Supersedes the old
      # `npm pack --dry-run` (contents are asserted inside the verify).
      - name: Verify zero-warning global install
        run: bun run install:verify

      - name: Clear token auth for trusted publishing
        run: |
          unset NODE_AUTH_TOKEN
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Verify npm latest dist-tag
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "release-please did not provide an expected version" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            published_version="$(npm view @gitlawb/openclaude version 2>/dev/null || true)"
            latest_tag="$(npm view @gitlawb/openclaude dist-tags.latest 2>/dev/null || true)"
            latest_version="$(npm view @gitlawb/openclaude@latest version 2>/dev/null || true)"

            echo "Attempt ${attempt}: version=${published_version:-<empty>} latest=${latest_tag:-<empty>} @latest=${latest_version:-<empty>} expected=${EXPECTED_VERSION}"

            if [ "$published_version" = "$EXPECTED_VERSION" ] && \
               [ "$latest_tag" = "$EXPECTED_VERSION" ] && \
               [ "$latest_version" = "$EXPECTED_VERSION" ]; then
              echo "npm latest verified for @gitlawb/openclaude@${EXPECTED_VERSION}"
              exit 0
            fi

            sleep 10
          done

          echo "npm latest dist-tag did not resolve to ${EXPECTED_VERSION}" >&2
          echo "Observed package version: ${published_version:-<empty>}" >&2
          echo "Observed dist-tags.latest: ${latest_tag:-<empty>}" >&2
          echo "Observed @latest version: ${latest_version:-<empty>}" >&2
          exit 1

      - name: Release summary
        run: |
          {
            echo "## Released ${{ needs.release-please.outputs.tag_name }}"
            echo
            echo "- npm: https://www.npmjs.com/package/@gitlawb/openclaude"
            echo "- GitHub: https://github.com/Gitlawb/openclaude/releases/tag/${{ needs.release-please.outputs.tag_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build & Push Docker Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      - name: Build and load locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: openclaude:smoke
          cache-from: type=gha

      - name: Smoke test
        run: docker run --rm openclaude:smoke --version

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
